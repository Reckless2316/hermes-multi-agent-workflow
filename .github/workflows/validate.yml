name: Validate

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate triage config
        run: python -m cli.triage validate
      - name: Run unit tests
        run: python -m unittest discover -s tests
      - name: Compile Python
        run: python -m compileall -q engine trading scripts tests
