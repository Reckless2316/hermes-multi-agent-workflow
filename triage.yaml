name: automated-trading
board: trading
workspace_root: ./work
cost_gate_usd: 8
sources:
  - id: options
    profile: options_scout
    skill: triage-scout-options
    schedule: "10,40 13-20 * * 1-5"
    query: |
      Run scripts/scan_objective_options.py with strategy/objective_options_v1.yaml,
      --objective ${OPTIONS_OBJECTIVE:-auto} and --max-aggression
      ${OPTIONS_MAX_AGGRESSION:-1.0}. The dial runs income (0) -> growth (0.5)
      -> speculation (1); auto sets it from measured IV/RV and trend. The
      deterministic scanner is source of truth for objective, structure, strikes,
      prices, Greeks, POP, breakevens, max loss, BPR, size, status, and exact OCC
      legs. Never invent IV Rank. Zero candidates and "no structural edge" are
      valid outcomes. Market/news context is researched downstream.
  - id: swing
    profile: swing_scout
    skill: triage-scout-swing
    schedule: "25 * * * *"
    query: |
      Scout liquid swing setups using model-trader-style pass/fail gates:
      DATA_OK -> HTF_BIAS -> LTF_FVG -> CISD_CONFIRM -> LEVELS. Report TAKE/WAIT only.
item_schema:
  fields: [title, claim, sources, why_it_may_matter, candidate_id, symbol, style, direction, setup_status, timeframe, entry, stop, target, gates_passed, reason, structure, expiration, strikes, width, credit, natural_credit, mid_credit_mark, max_profit, max_loss, buying_power_reduction, capital_efficiency, premium_to_bpr, short_delta, mid_iv, iv_rank, contracts, total_max_loss, total_buying_power_reduction, profit_target_pct, manage_at_dte, strategy_version, risk_r, catalyst, objective, aggression, objective_source, bias, payoff_multiple, pop_at_iv, breakevens, expected_move, model_edge_rv, vol_regime, trend]
dedup: {method: token-cosine, duplicate_threshold: 0.62, possible_threshold: 0.40}
rubric:
  threshold: 70
  dimensions:
    - {key: setup_clarity, max: 25, hint: "exact deterministic gates/legs; no vibes"}
    - {key: risk_reward, max: 20, hint: "defined max loss, verified BPR, capital efficiency/payoff multiple and size fitting the stated objective"}
    - {key: gate_completeness, max: 25, hint: "options: Tradier snapshot/liquidity/DTE/delta/width/premium/sizing plus objective gates (POP/payoff/breakeven reach); swing: DATA/HTF/LTF/CISD/LEVELS"}
    - {key: market_context, max: 15, hint: "earnings, macro, material news; never fabricate IV Rank"}
    - {key: uniqueness, max: 15, hint: "not duplicate/open or recently invalidated"}
research_lanes:
  role: researcher
  lanes: [mechanical_verify, market_context, portfolio_risk]
  classifier_lane: portfolio_risk
route:
  classifier: portfolio_risk.disposition
  map: {options_take: options, swing_take: swing, wait: watch, skip: shelve, no_edge: shelve}
paths:
  options:
    prep:
      - {stage: revalidate_snapshot, role: analyst}
      - {stage: prepare_paper_order, role: analyst}
    propose: {role: orchestrator, template: paths/proposals/options.md}
    fulfill:
      - {stage: materialize_setup, role: options_trader}
      - {stage: paper_execute, role: options_trader}
      - {stage: journal_report, role: orchestrator}
    workspace_subdir: options
    scope_rails: paths/rails/options.md
    deliverable_spec: paths/specs/options.md
  swing:
    prep:
      - {stage: synthesize_setup, role: analyst}
      - {stage: compute_levels, role: analyst}
    propose: {role: orchestrator, template: paths/proposals/swing.md}
    fulfill:
      - {stage: paper_execute, role: swing_trader}
      - {stage: journal_report, role: orchestrator}
    workspace_subdir: swings
    scope_rails: paths/rails/swing.md
    deliverable_spec: paths/specs/swing.md
  watch:
    prep: [{stage: define_trigger, role: analyst}]
    propose: {role: orchestrator, template: paths/proposals/watch.md}
    fulfill:
      - {stage: arm_monitor, role: swing_trader}
      - {stage: journal_report, role: orchestrator}
    workspace_subdir: watchlist
    scope_rails: paths/rails/watch.md
    deliverable_spec: paths/specs/watch.md
  shelve: {auto: true}
roles: {orchestrator: orchestrator, researcher: researcher, analyst: analyst, options_trader: options_trader, swing_trader: swing_trader}
gate:
  channel: telegram
  approve: [approve]
  shelve: [shelve, "reject the rest"]
  modify: [modify]
